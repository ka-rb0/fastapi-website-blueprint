# Caddy's address on the reverse-proxy network, pinned (see the network's
# ipam config below) so Uvicorn can trust exactly that peer for X-Forwarded-*
# instead of trusting the whole network with "*". One literal, referenced
# from both the network's static assignment and the proxy backend's native
# Uvicorn configuration below, so the two can't drift apart.
x-caddy-ip: &caddy_ip 172.28.238.6

x-development-build: &development_build
  context: ..
  dockerfile: .devcontainer/Dockerfile

services:
  master:
    build:
      # Build from the repo root so the lockfiles are available, and stop at
      # the desktop agent stage. The distribution branch is not built.
      <<: *development_build
      target: agent
    # A real PID 1 that reaps orphans - `sleep infinity` doesn't, and a
    # devcontainer spawns many short-lived processes (VS Code server, test
    # runs, agent CLIs).
    init: true
    # ${VAR:?} makes a missing .env fail fast with a clear message instead of
    # a cryptic interpolation error - see .env.example for the expected values.
    volumes:
      - ..:/workspace
      - ../shared_folder/data:${DATA_PATH:?set it in .devcontainer/.env, see .env.example}
      - ${CLAUDE_HOME_HOST_PATH:?set it in .devcontainer/.env, see .env.example}:/root/.claude
      - ${CODEX_HOME_HOST_PATH:?set it in .devcontainer/.env, see .env.example}:/root/.codex
      # Anonymous volumes: keep these container-generated directories from
      # syncing back to the host.
      - /workspace/.pytest_cache
      - /workspace/.ruff_cache
      - /workspace/.mypy_cache
      - /workspace/.venv
      - /workspace/node_modules
    environment:
      # No "${PYTHONPATH}:" prefix: an empty leading entry would put the
      # current working directory on sys.path.
      PYTHONPATH: /workspace/src
      # Don't write .pyc files (__pycache__ directories).
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_PATH: ${DATA_PATH}
      # Native server settings for the direct development listener. Proxy-only
      # settings belong to the separate proxy-backend service below, so no
      # root path can leak into this process or the test servers it launches.
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: ${UVICORN_PORT:?set it in .devcontainer/.env, see .env.example}
      # Host-header allowlist (Settings.trusted_hosts in src/app/config.py):
      # the code's local default plus proxy.localhost, the public name whose
      # requests Caddy forwards. Overridable from .env, e.g. to add a LAN IP
      # when testing from a phone (see .env.example).
      WEBSITE_TRUSTED_HOSTS: ${WEBSITE_TRUSTED_HOSTS:-localhost,127.0.0.1,proxy.localhost}
      # The inclusive port range the test suite's own uvicorn servers bind,
      # one consecutive port each (tests/conftest.py) - kept apart from the
      # dev server ports so the dev server can stay up during a test run.
      WEBSITE_TEST_PORT_MIN: ${WEBSITE_TEST_PORT_MIN:-11120}
      WEBSITE_TEST_PORT_MAX: ${WEBSITE_TEST_PORT_MAX:-11199}
      # Interactive API docs (/docs) are a dev tool: on by default in this
      # dev container, off anywhere the variable isn't set (production).
      WEBSITE_ENABLE_DOCS: ${WEBSITE_ENABLE_DOCS:-1}
    # No privilege escalation via setuid binaries, and drop the raw-socket capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    ports:
      # 127.0.0.1 is only reachable from this machine, 0.0.0.0 exposes it to the LAN.
      - "${WEBSITE_BIND_HOST:-127.0.0.1}:${WEBSITE_EXTERNAL_PORT:?set it in .devcontainer/.env, see .env.example}:${UVICORN_PORT}"
    networks:
      - fastapi-website-blueprint-network
    command: sleep infinity

  # A separate process gets the same native UVICORN_* reverse-proxy contract
  # as the distribution image. Keeping it outside master prevents its root
  # path from affecting the direct development listener or test subprocesses.
  proxy-backend:
    build:
      <<: *development_build
      # The server needs dev's reload support, not the agent CLIs.
      target: dev
    init: true
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro
    environment:
      PYTHONPATH: /workspace/src
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: ${WEBSITE_PROXY_BACKEND_PORT:?set it in .devcontainer/.env, see .env.example}
      UVICORN_RELOAD: "true"
      UVICORN_ROOT_PATH: ${UVICORN_ROOT_PATH:?set it in .devcontainer/.env, see .env.example}
      UVICORN_PROXY_HEADERS: "true"
      # Trust only Caddy's pinned address, never every network peer.
      UVICORN_FORWARDED_ALLOW_IPS: *caddy_ip
      WEBSITE_TRUSTED_HOSTS: ${WEBSITE_TRUSTED_HOSTS:-localhost,127.0.0.1,proxy.localhost}
      WEBSITE_ENABLE_DOCS: ${WEBSITE_ENABLE_DOCS:-1}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    command: ["uvicorn", "app.main:app"]
    networks:
      - fastapi-website-blueprint-network

  caddy:
    # Caddy is development infrastructure, not part of the distribution image.
    # It starts with the Dev Container but remains independent: `master` does
    # not depend on it, and removing this service leaves direct development
    # unchanged. The tag and multi-platform digest are Dependabot-managed.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    init: true
    environment:
      WEBSITE_PROXY_HTTPS_PORT: ${WEBSITE_PROXY_HTTPS_PORT:?set it in .devcontainer/.env, see .env.example}
      WEBSITE_PROXY_BACKEND_PORT: ${WEBSITE_PROXY_BACKEND_PORT:?set it in .devcontainer/.env, see .env.example}
      UVICORN_ROOT_PATH: ${UVICORN_ROOT_PATH:?set it in .devcontainer/.env, see .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist Caddy's local development CA so its root certificate stays
      # stable across container rebuilds and only needs to be trusted once.
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The official image listens on the standard HTTP/HTTPS ports.
      - NET_BIND_SERVICE
    ports:
      - "127.0.0.1:${WEBSITE_PROXY_HTTP_PORT:?set it in .devcontainer/.env, see .env.example}:80"
      - "127.0.0.1:${WEBSITE_PROXY_HTTPS_PORT:?set it in .devcontainer/.env, see .env.example}:443"
    networks:
      fastapi-website-blueprint-network:
        ipv4_address: *caddy_ip

networks:
  fastapi-website-blueprint-network:
    driver: bridge
    ipam:
      config:
        # Deliberately a small, unusual range so pinning it is unlikely to
        # collide with another Compose project's network already running on
        # your machine. If `docker compose up` ever fails on a subnet
        # overlap, change this (and x-caddy-ip above) to a free range.
        - subnet: 172.28.238.0/29

volumes:
  caddy-data:
  caddy-config:
