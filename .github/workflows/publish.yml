# Builds the `distribution` stage of the consolidated .devcontainer/Dockerfile
# (see .devcontainer/README.md for the stage graph) and publishes it to this
# repo's GitHub Container Registry namespace, ghcr.io/<owner>/<repo>.
#
# What each event produces:
#   push to main    -> :main and :sha-<short>            (rolling default-branch image)
#   push tag v1.2.3 -> :1.2.3, :1.2 and :latest, then a deploy to Azure
#   push tag v1.2.3-rc.1 -> :1.2.3-rc.1 only; no :latest, and no deploy
#   pull request    -> nothing published; the image is built to prove the
#                      Dockerfile and the locked dependencies still produce a
#                      working image, then discarded
#
# `:sha-<short>` is deliberately scoped to main (see the metadata step): a
# release tag is cut on a commit that main already carries, so without that
# scoping the tag run would rebuild the same commit and repoint `:sha-<short>`
# at a second, different digest - the timestamp label alone changes it. The
# version tags a release publishes are never rewritten; the tag ruleset in
# .github/rulesets/protect-tags.json keeps the git tag behind them fixed too.
#
# Every published digest carries two Sigstore-signed attestations:
#   - SLSA build provenance - which repo, workflow, commit and run built it
#   - an SPDX SBOM          - what is inside it
# Both are stored in GitHub and pushed beside the image in the registry, and
# both are verified against the real registry by the `verify` job below before
# the run is allowed to go green. docs/GITHUB_SETUP.md covers how consumers
# check them.
#
# Images are multi-platform (linux/amd64 + linux/arm64), arm64 is built under
# QEMU emulation, which is why the job's timeout is generous; if that ever
# gets too slow, the faster route is a build matrix across `ubuntu-latest` and
# the native `ubuntu-24.04-arm` runner, merging the two digests with
# `docker buildx imagetools create`.
#
# The image is built from the repository root, like every other build of this
# Dockerfile: .dockerignore is an allowlist that admits exactly what the stages
# COPY / bind-mount (pyproject.toml, uv.lock, src/app), so the build context
# stays small without a second ignore file here.
#
# Same pinning rules as ci.yml: actions pinned to commit SHAs, kept current by
# Dependabot's github-actions entry (it scans every file in .github/workflows).
name: Publish

on:
  push:
    branches: [main]
    # Three-part, v-prefixed tags only - the semver tag patterns below need a
    # major.minor.patch to parse. Prereleases (v1.2.3-rc.1) publish their exact
    # version but deliberately do not move :latest.
    tags: ["v*.*.*"]
  # Fork PRs never trigger push events here, and a broken Dockerfile should not
  # reach main - so PRs get a build-only run (no registry credentials involved).
  pull_request:
  # Same reasoning as ci.yml: keeps the check alive if a repo built from this
  # template makes it required and enables GitHub's merge queue.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch or PR build is fine; a release tag must always finish
  # publishing, so tag runs are never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# default to nothing; the job grants itself exactly what it needs
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Emulated arm64 makes this several times slower than the amd64-only build
    # it replaced - the ceiling is deliberately loose rather than tuned.
    timeout-minutes: 45
    permissions:
      contents: read # checkout
      # push to ghcr.io, and store the attestations beside the image there.
      # Unused on pull_request/merge_group runs - GitHub issues a read-only
      # token for fork PRs regardless, and nothing is pushed there.
      packages: write
      id-token: write # mint the OIDC token Sigstore signs the attestations with
      attestations: write # persist the attestations to this repository
      # Lets actions/attest write an Artifact Metadata storage record for the
      # pushed digest. That API is org-scoped
      # (POST /orgs/{owner}/artifacts/metadata/storage-record), so under a
      # user account the action detects the non-org owner and skips the call:
      # the grant is inert here, kept so this keeps working if the repo moves
      # under an organization, where the records surface at
      # https://github.com/orgs/<org>/artifacts.
      artifact-metadata: write # list the image on the repo's artifacts page
    # Consumed by the verify job, which re-fetches the image from the registry
    # rather than trusting anything left behind in this job.
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # don't leave the workflow token in .git/config for later steps
          persist-credentials: false
          # Release tags need main's history for the ancestry check below;
          # branch and PR runs only need the tree. Quoted because 0 is falsy in
          # a workflow expression - a bare 0 would collapse into the 1 branch.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      # The branch ruleset protects main, but nothing stops `git tag v9.9.9` on
      # a commit that never opened a PR - and that tag is what becomes :latest.
      # Refuse to publish a release built from a commit that is not on main.
      # .github/rulesets/protect-tags.json covers the other half: once pushed, a
      # release tag cannot be moved or deleted.
      - name: Require the release tag to be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null || {
            echo "::error::main was not fetched - the checkout step above needs fetch-depth 0 on tag runs."
            exit 1
          }
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main - merge it first, then re-tag."
            exit 1
          fi
      # Registers QEMU binfmt handlers so the amd64 runner can execute arm64
      # binaries - `uv sync` and `useradd` in the Dockerfile have to actually
      # run for the arm64 variant. Needed only because this builds more than
      # the runner's native platform.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # build-push-action drives Buildx; this step provisions it with the
      # container driver, which the Dockerfile's `# syntax=` frontend, its
      # `--mount=type=bind` lockfile mounts and multi-platform output need a
      # current BuildKit for.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Only publishing runs authenticate. GITHUB_TOKEN's packages:write scope
      # is enough to push to the repo's own namespace - no PAT, no secret to
      # rotate.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io rejects upper-case names, and a repository owner or name may
      # contain them. metadata-action lower-cases `images` on its own; the
      # attestations' subject-name is taken literally, so both read this.
      - name: Derive the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Derives the tag list and the OCI labels/annotations (source repo,
      # revision, created timestamp, license) from the triggering ref, so the
      # published image is traceable back to the commit that built it.
      # :latest comes from the action's default `latest=auto` flavor - it is
      # attached to non-prerelease semver tags only, never to main.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            # Default-branch pushes only: see the header comment for why a
            # release tag must not repoint this at a second digest.
            type=sha,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          # The stage that carries only the app and its runtime deps. Without
          # it BuildKit would build the last stage - the same one today, but an
          # added stage must not silently change what gets published.
          target: distribution
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # BuildKit's own provenance attestation stays off. It is unsigned -
          # anyone who can push to a registry can write one - and it adds
          # `unknown/unknown` entries that GHCR lists as extra untagged
          # artifacts. The signed attestations created below are this image's
          # authoritative provenance and SBOM. (BuildKit's `sbom: true` is
          # declined for the same reason: unsigned, and Syft below produces a
          # richer SPDX document.)
          provenance: false
      # Everything from here on describes an image that was actually pushed.
      # `steps.build.outputs.digest` is the digest of the multi-platform index,
      # which is what every tag above resolves to - so attesting it covers the
      # image consumers actually pull, whatever their architecture.
      #
      # Proof the image was built from this repository, by this workflow:
      # signs the pushed digest with a short-lived Sigstore certificate issued
      # against the job's OIDC identity, and records a SLSA build provenance
      # attestation. Free on public repos (private ones need Enterprise Cloud).
      #
      # push-to-registry additionally stores the attestation beside the image in
      # GHCR, so registry-only verifiers (cosign, Kyverno admission policies)
      # can check it without reaching the GitHub API. Both attestations land
      # under the same `sha256-<digest>` referrer tag, so this costs one extra
      # artifact per published version, not two - the reason it is worth the
      # untagged entry that `provenance: false` above declines.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Syft inspects the pushed image and inventories what is in it: the
      # Debian packages from the base layer and the Python distributions uv
      # installed. That inventory is what answers "are we affected?" when the
      # next widely-exploited CVE lands, without rebuilding or guessing.
      #
      # Scanning by digest, not by tag, ties the SBOM to the exact bytes the
      # attestation below covers - a tag could move between the two steps.
      # Syft reads one platform out of a multi-platform index; linux/amd64 is
      # named explicitly rather than left to default to the runner's. The two
      # variants share their Python and Debian package sets, differing in
      # compiled artifacts, so the amd64 inventory describes both closely but
      # not byte-for-byte.
      #
      # upload-artifact is off: the SBOM's durable home is the signed
      # attestation, retrievable with `gh attestation verify --format json`,
      # which outlives the 90-day cap on workflow artifacts.
      - name: Generate the SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      # Signs the SBOM the same keyless way as the provenance above, against
      # the same digest. An unsigned SBOM is a text file anyone can rewrite;
      # signed, it is a statement this workflow is accountable for.
      #
      # actions/attest with sbom-path, not actions/attest-sbom: the latter is
      # deprecated and now only forwards to an older pinned actions/attest.
      # Passing sbom-path makes this an SPDX attestation
      # (predicate type https://spdx.dev/Document, the one the verify job
      # below checks for) rather than the provenance the step above produces.
      - name: Attest the SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # Closes the loop: everything above proves the build succeeded, nothing above
  # proves the artifact is usable. This job throws away the build context and
  # approaches the registry the way a consumer would - pull the digest, verify
  # both signatures, boot the container, hit the readiness probe. A push that
  # publishes an unbootable or unverifiable image fails here rather than in
  # somebody's deployment.
  #
  # The trade-off is that this runs after the tags already moved: the publish
  # job pushes :latest (or :main) and only then attests, so an image that
  # fails here has been the default pull for the length of this job. Closing
  # that window means publishing the digest untagged and moving the tags in a
  # third job once verification passes - which the tag list and the labels
  # above, both derived at build time, are not currently shaped for. Failing
  # loudly and re-publishing over a bad tag is an acceptable compromise for now.
  verify:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout is not needed, but gh resolves the repo with it
      packages: read # pull the image back out of ghcr.io
      # `permissions:` zeroes out every scope it does not list, so the read
      # side of what the publish job wrote has to be named explicitly.
      attestations: read # look the attestations up through the GitHub API
    steps:
      # The package is private until its visibility is changed by hand after
      # the first publish (docs/GITHUB_SETUP.md covers it), so authenticate
      # rather than assume anonymous pulls work. gh reads the same credential
      # store for the oci:// lookup below.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fails on any image this repository's workflow did not build and sign,
      # including one pushed under a look-alike name. --predicate-type selects
      # which of the two attestations is being checked; both must pass.
      - name: Verify the signed attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: oci://${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          gh attestation verify "$IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "$IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document
      # A smoke test, not a test suite: CI already ran pytest against the
      # source. What is unproven here is that the *image* starts - a missing
      # runtime dependency, a bad PYTHONPATH or an unwritable path for the
      # unprivileged user would all pass CI and fail only at `docker run`.
      # 127.0.0.1 is in the app's default trusted hosts, so no
      # WEBSITE_TRUSTED_HOSTS is needed for a local probe.
      - name: Boot the published image and probe /readyz
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          docker run --rm --init --detach --name smoke \
            --publish 8000:8000 "$IMAGE_REF"
          # Poll rather than sleep a fixed interval: uvicorn is usually up in
          # under a second, and a hung start should fail fast with the logs.
          for _ in $(seq 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/readyz; then
              echo "::notice::Published image booted and reported healthy."
              docker rm --force smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::The published image never answered /readyz."
          docker logs smoke || true
          docker rm --force smoke >/dev/null
          exit 1

  # Rolls a verified release out to Azure Container Apps.
  #
  # This is a job here rather than a deploy.yml keyed to `release: published`
  # because only at this point is the digest already trustworthy: `verify`
  # above pulled it back out of the registry, checked both Sigstore
  # signatures and proved it boots. A separate workflow would have to
  # re-resolve a tag to a digest and race this one to do it.
  #
  # Only full releases deploy. A prerelease (v1.2.3-rc.1) publishes its image
  # and stops here - the same line `latest=auto` already draws for :latest,
  # and the reason .github/rulesets/protect-tags.json admits a `-prerelease`
  # suffix at all. `contains(..., '-')` is a sound test for that because the
  # ruleset's tag_name_pattern lets a hyphen appear nowhere else.
  #
  # The deployment target comes from repository variables, not from this file:
  # which resources a release lands on is a property of the repository, not of
  # the code, so a fork or a second environment retargets it without a commit.
  # They are `vars`, not `secrets`, because resource names are not
  # confidential - `vars` keeps them readable in the run log, where they are
  # exactly what you want to see when a deploy goes somewhere unexpected.
  # docs/GITHUB_SETUP.md lists both.
  deploy:
    needs: [publish, verify]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Load-bearing, not decoration. Without an `environment`, this job's OIDC
    # token carries the subject `repo:<owner>/<repo>:ref:refs/tags/v1.2.3` -
    # a different string for every release, and an Azure federated identity
    # credential matches one fixed subject, so the login would fail on the
    # first release and every one after it. Naming the environment pins the
    # subject to `repo:<owner>/<repo>:environment:production` for good. It
    # also gives releases an approval gate and a deployment log. The exact
    # value to set on the Azure side is in docs/GITHUB_SETUP.md.
    environment:
      name: production
      url: https://${{ steps.target.outputs.fqdn }}
    permissions:
      contents: read
      id-token: write # mint the OIDC token Azure exchanges for an access token
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      # An undefined variable interpolates to the empty string rather than
      # failing, and `az ... --name ""` reports a generic argument error that
      # says nothing about the cause. Name it here instead, before the run has
      # signed in to anything.
      - name: Check the deployment target is configured
        run: |
          set -euo pipefail
          missing=""
          [ -n "$RESOURCE_GROUP" ] || missing="AZURE_RESOURCE_GROUP"
          [ -n "$CONTAINER_APP" ] || missing="${missing:+${missing}, }AZURE_CONTAINER_APP"
          if [ -n "$missing" ]; then
            echo "::error::Deployment target not configured - unset variable(s): ${missing}. Add them under Settings -> Secrets and variables -> Actions -> Variables (see docs/GITHUB_SETUP.md)."
            exit 1
          fi
      # Federated sign-in: GitHub mints a short-lived token and Azure trades
      # it for an access token. No client secret exists, so there is nothing
      # here to leak or rotate. The three values are identifiers rather than
      # credentials; they live in secrets by convention, not necessity.
      - name: Sign in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # `az containerapp` is an extension, and the runner image's preinstalled
      # extension set is not something to depend on. Adding it explicitly also
      # sidesteps az's dynamic-install prompt, which has nobody to answer it.
      - name: Install the containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      # Reads the deployment target's own ingress rather than restating it
      # here, so the two cannot drift, and refuses to deploy into a shape that
      # would fail silently. Each check below is a failure this app has a
      # documented way of producing.
      - name: Resolve the ingress and check its shape
        id: target
        run: |
          set -euo pipefail
          ingress=$(az containerapp show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress --output json \
            --only-show-errors)
          if [ -z "$ingress" ] || [ "$ingress" = "null" ]; then
            echo "::error::${CONTAINER_APP} has no ingress - nothing can reach the app. See docs/GITHUB_SETUP.md."
            exit 1
          fi
          # The image listens on 8000 (UVICORN_PORT in .devcontainer/Dockerfile).
          # A mismatch here means ingress accepts traffic and forwards it to a
          # closed port, so every request fails while the revision looks healthy.
          port=$(jq -r '.targetPort' <<<"$ingress")
          if [ "$port" != "8000" ]; then
            echo "::error::Ingress targetPort is ${port}; the image listens on 8000. Fix it once: az containerapp ingress update --name ${CONTAINER_APP} --resource-group ${RESOURCE_GROUP} --target-port 8000"
            exit 1
          fi
          # In multiple-revision mode a new revision is created with no traffic
          # weight, so the deploy below would be a silent no-op: the probes at
          # the end would pass against the *old* revision and the run would go
          # green having changed nothing anyone can reach.
          mode=$(az containerapp show \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.activeRevisionsMode \
            --output tsv --only-show-errors)
          if [ "$mode" != "Single" ]; then
            echo "::error::Active revision mode is ${mode}; this job assumes Single, where the new revision takes all traffic. Splitting traffic needs an explicit 'az containerapp ingress traffic set' step here."
            exit 1
          fi
          # An internal ingress still gets an FQDN, but one that resolves only
          # inside the environment's network - the probe at the end of this
          # job would hang against it and the environment URL would point
          # somewhere nobody can open.
          if [ "$(jq -r '.external' <<<"$ingress")" != "true" ]; then
            echo "::error::Ingress is internal; this job deploys a public site and probes it over the internet. Make it external, or drop the probe step and the environment URL."
            exit 1
          fi
          # `jq -r` renders a JSON null as the four characters "null", so an
          # absent FQDN would otherwise flow on as a real-looking value: the
          # environment URL becomes https://null and the probe fails against
          # a name that does not resolve. The host list built from it comes
          # out empty instead, because join() renders null as nothing - and
          # an empty WEBSITE_TRUSTED_HOSTS makes the app refuse to boot, so
          # the run would fail several minutes later as a crash-looping
          # revision, naming nothing that points back here. `// empty` turns
          # both into an empty string this catches immediately.
          fqdn=$(jq -r '.fqdn // empty' <<<"$ingress")
          if [ -z "$fqdn" ]; then
            echo "::error::Ingress reports no FQDN, so there is no address to trust or to probe. Check that ingress finished provisioning on ${CONTAINER_APP}."
            exit 1
          fi
          # Every name a visitor can reach the site by has to be in the app's
          # Host allowlist, or it answers 400 (see "Trusted hosts" in
          # docs/ARCHITECTURE.md). Deriving the list from the ingress means
          # binding a custom domain does not silently take the site down on
          # the next release. customDomains is null when none are bound.
          #
          # The select() drops a null or empty custom-domain name rather than
          # letting it reach the allowlist: the app strips empty entries
          # itself, but a literal "null" would become a trusted host named
          # null. Deliberately not `unique` - that sorts, which would move the
          # FQDN out of first place in the log line for no gain, and a
          # duplicate host is harmless to TrustedHostMiddleware anyway.
          hosts=$(jq -r '[.fqdn] + [(.customDomains // [])[].name] | map(select(. != null and . != "")) | join(",")' <<<"$ingress")
          echo "fqdn=${fqdn}" >> "$GITHUB_OUTPUT"
          echo "hosts=${hosts}" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying to ${fqdn} (trusted hosts: ${hosts})"
      # By digest, never by tag: this is the exact artifact `verify` proved,
      # and a tag could be repointed between that job and this one.
      #
      # --set-env-vars upserts the named variables and leaves the rest of the
      # app's environment alone, so this owns the two settings the image
      # cannot get right on its own and claims nothing else:
      #
      #   WEBSITE_TRUSTED_HOSTS - unset, the image trusts only localhost and
      #     127.0.0.1, and every route except the probes answers 400.
      #
      #   UVICORN_FORWARDED_ALLOW_IPS - the image ships 127.0.0.1, and the
      #     Envoy ingress in front of this container is never loopback, so the
      #     default can never match it: the homepage would advertise an http://
      #     canonical link for an https:// site and log Envoy's address as
      #     every visitor's. QUICKSTART.md argues against `*` because a client
      #     could then spoof X-Forwarded-For or X-Forwarded-Proto - but that
      #     argument assumes clients can open connections to the container.
      #     Container Apps does not route to the target port from outside;
      #     Envoy is the only peer that can ever connect, and it has no stable
      #     address to name instead. If this app is ever given a route that
      #     bypasses ingress, this line stops being safe.
      - name: Deploy the release
        id: deploy
        env:
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          TRUSTED_HOSTS: ${{ steps.target.outputs.hosts }}
        run: |
          set -euo pipefail
          revision=$(az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars \
              "WEBSITE_TRUSTED_HOSTS=${TRUSTED_HOSTS}" \
              "UVICORN_FORWARDED_ALLOW_IPS=*" \
            --query properties.latestRevisionName --output tsv --only-show-errors)
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "::notice::Created revision ${revision} from ${IMAGE}"
      # `az containerapp update` returns once the revision is *created*, not
      # once it runs. Without this wait the probes below would race the
      # rollout and most likely answer from the outgoing revision.
      - name: Wait for the revision to run
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          for _ in $(seq 60); do
            state=$(az containerapp revision show \
              --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" --query properties.runningState \
              --output tsv --only-show-errors)
            case "$state" in
              Running)
                echo "::notice::${REVISION} is running."
                exit 0
                ;;
              Failed | Degraded)
                echo "::error::${REVISION} settled in state ${state}."
                # The revision object carries provisioningError; it is
                # available whether or not Log Analytics has caught up.
                az containerapp revision show \
                  --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
                  --revision "$REVISION" --output json --only-show-errors || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::${REVISION} never reached Running within 5 minutes."
          exit 1
      # The deploy is not done until the public address serves the new image.
      #
      # /readyz on its own would not prove that: the probe routes are
      # exempt from the Host allowlist, so they answer 200 even when
      # WEBSITE_TRUSTED_HOSTS is wrong and every real page returns 400 - the
      # single most likely way this deployment breaks. Probing the homepage
      # too is what actually covers it, and it exercises the template render
      # and static assets that a health check never touches.
      - name: Probe the deployed site
        env:
          FQDN: ${{ steps.target.outputs.fqdn }}
        run: |
          set -euo pipefail
          for path in /readyz /; do
            url="https://${FQDN}${path}"
            for attempt in $(seq 20); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "::notice::${url} -> 200"
                break
              fi
              if [ "$attempt" = "20" ]; then
                echo "::error::${url} answered ${code}, not 200. A 400 here with a healthy /readyz means WEBSITE_TRUSTED_HOSTS does not cover ${FQDN}."
                exit 1
              fi
              sleep 3
            done
          done
