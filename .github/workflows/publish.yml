# Builds the `distribution` stage of the consolidated .devcontainer/Dockerfile
# (see .devcontainer/README.md for the stage graph) and publishes it to this
# repo's GitHub Container Registry namespace, ghcr.io/<owner>/<repo>.
#
# What each event produces:
#   push to main    -> :main and :sha-<short>            (rolling default-branch image)
#   push tag v1.2.3 -> :1.2.3, :1.2 and :latest          (immutable release)
#   pull request    -> nothing published; the image is built to prove the
#                      Dockerfile and the locked dependencies still produce a
#                      working image, then discarded
#
# Everything published is signed: each pushed digest gets a Sigstore-signed SLSA
# build provenance attestation tying it to this repository and this workflow (see
# the attest step, and docs/GITHUB_SETUP.md for how consumers verify it).
#
# The image is built from the repository root, like every other build of this
# Dockerfile: .dockerignore is an allowlist that admits exactly what the stages
# COPY / bind-mount (pyproject.toml, uv.lock, src/app), so the build context
# stays small without a second ignore file here.
#
# Same pinning rules as ci.yml: actions pinned to commit SHAs, kept current by
# Dependabot's github-actions entry (it scans every file in .github/workflows).
name: Publish

on:
  push:
    branches: [main]
    # Three-part, v-prefixed tags only - the semver tag patterns below need a
    # major.minor.patch to parse. Prereleases (v1.2.3-rc.1) publish their exact
    # version but deliberately do not move :latest.
    tags: ["v*.*.*"]
  # Fork PRs never trigger push events here, and a broken Dockerfile should not
  # reach main - so PRs get a build-only run (no registry credentials involved).
  pull_request:
  # Same reasoning as ci.yml: keeps the check alive if a repo built from this
  # template makes it required and enables GitHub's merge queue.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch or PR build is fine; a release tag must always finish
  # publishing, so tag runs are never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# default to nothing; the job grants itself exactly what it needs
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      # push to ghcr.io, and store the attestation beside the image there.
      # Unused on pull_request/merge_group runs - GitHub issues a read-only
      # token for fork PRs regardless, and nothing is pushed there.
      packages: write
      id-token: write # mint the OIDC token Sigstore signs the attestation with
      attestations: write # persist the attestation to this repository
      artifact-metadata: write # list the image on the repo's artifacts page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # don't leave the workflow token in .git/config for later steps
          persist-credentials: false
          # Release tags need main's history for the ancestry check below;
          # branch and PR runs only need the tree. Quoted because 0 is falsy in
          # a workflow expression - a bare 0 would collapse into the 1 branch.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      # The branch ruleset protects main, but nothing stops `git tag v9.9.9` on
      # a commit that never opened a PR - and that tag is what becomes :latest.
      # Refuse to publish a release built from a commit that is not on main.
      # .github/rulesets/protect-tags.json covers the other half: once pushed, a
      # release tag cannot be moved or deleted.
      - name: Require the release tag to be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git rev-parse --verify --quiet origin/main >/dev/null || {
            echo "::error::main was not fetched - the checkout step above needs fetch-depth 0 on tag runs."
            exit 1
          }
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main - merge it first, then re-tag."
            exit 1
          fi
      # build-push-action drives Buildx; this step provisions it with the
      # container driver, which the Dockerfile's `# syntax=` frontend and its
      # `--mount=type=bind` lockfile mounts need a current BuildKit for.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Only publishing runs authenticate. GITHUB_TOKEN's packages:write scope
      # is enough to push to the repo's own namespace - no PAT, no secret to
      # rotate.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io rejects upper-case names, and a repository owner or name may
      # contain them. metadata-action lower-cases `images` on its own; the
      # attestation's subject-name is taken literally, so both read this.
      - name: Derive the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Derives the tag list and the OCI labels/annotations (source repo,
      # revision, created timestamp, license) from the triggering ref, so the
      # published image is traceable back to the commit that built it.
      # :latest comes from the action's default `latest=auto` flavor - it is
      # attached to non-prerelease semver tags only, never to main.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          # The stage that carries only the app and its runtime deps. Without
          # it BuildKit would build the last stage - the same one today, but an
          # added stage must not silently change what gets published.
          target: distribution
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # BuildKit's own provenance attestation stays off. It is unsigned -
          # anyone who can push to a registry can write one - and it turns the
          # single-platform image into an index that GHCR lists as an extra
          # untagged `unknown/unknown` artifact. The signed attestation created
          # in the next step is this image's authoritative provenance.
          provenance: false
      # Proof the image was built from this repository, by this workflow:
      # signs the pushed digest with a short-lived Sigstore certificate issued
      # against the job's OIDC identity, and records a SLSA build provenance
      # attestation. Free on public repos (private ones need Enterprise Cloud).
      # Consumers verify with the GitHub CLI, which fails on any image that did
      # not come from here:
      #
      #   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> -R <owner>/<repo>
      #
      # push-to-registry additionally stores the attestation beside the image in
      # GHCR, so registry-only verifiers (cosign, Kyverno admission policies)
      # can check it without reaching the GitHub API. That costs one referrer
      # artifact per published version - the reason it is worth the untagged
      # entry that `provenance: false` above declines.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
